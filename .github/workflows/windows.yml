name: Application Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Tests
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Tests échoués" }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $Report = Join-Path $env:RUNNER_TEMP 'compagnon-smoke.json'
          $Process = Start-Process -FilePath '.\dist\Compagnon.exe' -ArgumentList @('--smoke-test', "`"$Report`"") -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Packaged runtime check failed" }
          if (-not (Test-Path $Report)) { throw "No smoke report produced" }
          $Result = Get-Content $Report -Raw | ConvertFrom-Json
          if (-not $Result.ok) { throw "Runtime check failed: $($Result.error)" }
          Get-Content $Report
      - uses: actions/upload-artifact@v4
        with:
          name: Compagnon-Windows
          path: dist/Compagnon.exe
          if-no-files-found: error
